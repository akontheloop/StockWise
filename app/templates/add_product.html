{% extends "base.html" %}

{% block title %}Add Product · StockWise{% endblock %}

{% block content %}

<div class="page-container">

    <section class="page-header">
        <div>
            <div class="eyebrow">INVENTORY MANAGEMENT</div>
            <h1>Add product<span class="heading-period">.</span></h1>
            <p class="page-subtitle">
                Add a new product to your inventory workspace.
            </p>
        </div>
    </section>

    <div class="panel" style="max-width: 900px; padding: 32px;">

        <form method="POST">

            <div style="margin-bottom: 28px;">
                <h2 style="font-size: 20px;">Product information</h2>
                <p style="color: #849087;">
                    Basic details used to identify and manage your product.
                </p>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 22px;">

                <div>
                    <label for="name">Product name *</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. Premium Hoodie"
                        required
                    >
                </div>

                <div>
                    <label for="sku">SKU</label>
                    <input
                        type="text"
                        id="sku"
                        name="sku"
                        placeholder="e.g. HD-001"
                    >
                </div>

                <div>
                    <label for="category">Category</label>
                    <input
                        type="text"
                        id="category"
                        name="category"
                        placeholder="e.g. Clothing"
                    >
                </div>

                <div>
                    <label for="variant">Variant</label>
                    <input
                        type="text"
                        id="variant"
                        name="variant"
                        placeholder="e.g. Black / XL"
                    >
                </div>

                <div>
                    <label for="cost_price">Cost price (₹)</label>
                    <input
                        type="number"
                        id="cost_price"
                        name="cost_price"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                    >
                </div>

                <div>
                    <label for="price">Selling price (₹)</label>
                    <input
                        type="number"
                        id="price"
                        name="price"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                    >
                </div>

                <div>
                    <label for="quantity">Stock quantity *</label>
                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        min="0"
                        value="0"
                        required
                    >
                </div>

                <div>
                    <label for="reorder_level">Low stock threshold</label>
                    <input
                        type="number"
                        id="reorder_level"
                        name="reorder_level"
                        min="0"
                        value="5"
                    >
                </div>

            </div>

            <div style="margin-top: 22px;">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Add product details..."
                ></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 30px;">

                <a href="{{ url_for('main.dashboard') }}"
                   class="button-secondary"
                   style="text-decoration: none; padding: 12px 20px;">
                    Cancel
                </a>

                <button type="submit" class="button-primary">
                    + Save product
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
