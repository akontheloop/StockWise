{% extends "base.html" %}

{% block content %}

<style>
.edit-supplier-page {
    padding: 40px;
    max-width: 750px;
}

.edit-supplier-page h1 {
    font-size: 40px;
    color: #202722;
    margin-bottom: 10px;
}

.edit-supplier-card {
    background: white;
    border: 1px solid #e3e9e4;
    border-radius: 20px;
    padding: 30px;
    margin-top: 30px;
}

.edit-supplier-card label {
    display: block;
    margin: 20px 0 8px;
    font-weight: 600;
    color: #56645a;
}

.edit-supplier-card input {
    width: 100%;
    padding: 14px;
    border: 1px solid #dce4dd;
    border-radius: 10px;
    box-sizing: border-box;
}

.edit-supplier-card button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #304a3b;
    color: white;
    border: none;
    border-radius: 11px;
    cursor: pointer;
    font-weight: 600;
}

.back-link {
    display: inline-block;
    margin-top: 20px;
    color: #476b54;
    text-decoration: none;
}
</style>

<div class="edit-supplier-page">

    <div style="font-size:12px; letter-spacing:2px; color:#8b978e; font-weight:700;">
        PROCUREMENT MANAGEMENT
    </div>

    <h1>Edit supplier<span style="color:#8ca58f;">.</span></h1>
    <p style="color:#7c877f;">Update supplier information.</p>

    <div class="edit-supplier-card">

        <form method="POST">

            <label>Supplier name</label>
            <input type="text" name="name" value="{{ supplier.name }}" required>

            <label>Email</label>
            <input type="email" name="email" value="{{ supplier.email or '' }}">

            <label>Phone</label>
            <input type="text" name="phone" value="{{ supplier.phone or '' }}">

            <label>Lead time (days)</label>
            <input type="number" name="lead_time_days"
                   value="{{ supplier.lead_time_days or 7 }}" min="0">

            <button type="submit">Save changes →</button>

        </form>

    </div>

    <a href="{{ url_for('main.suppliers') }}" class="back-link">
        ← Back to suppliers
    </a>

</div>

{% endblock %}
